version: 0.0
os: linux
files:
  - source: /
    destination: /var/www/html  # <--- CHANGED: This is where Apache looks
hooks:
  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: root